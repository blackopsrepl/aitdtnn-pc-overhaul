[Mapper]
Type = AITD4

[CustomMapper:AITD4]
; The game stores keyboard and joystick bindings separately. Its current keys.bin
; has valid keyboard bindings but all twelve joystick-binding fields are zero.
; Route the Xbox pad through those known-good keyboard bindings instead.
StickLeftX = Split( Keyboard(Right), Keyboard(Left) )
StickLeftY = Split( Keyboard(Down), Keyboard(Up) )
StickRightX = Compound( Axis(X), Keyboard(LShift) )
StickRightY = Compound( Axis(Y), Keyboard(LShift) )
DpadUp = Keyboard(Up)
DpadDown = Keyboard(Down)
DpadLeft = Keyboard(Left)
DpadRight = Keyboard(Right)
ButtonA = Keyboard(Space)
ButtonB = Keyboard(S)
ButtonX = Keyboard(A)
ButtonY = Keyboard(I)
ButtonLB = Keyboard(LShift)
ButtonRB = Keyboard(LControl)
TriggerLT = Keyboard(M)
TriggerRT = Keyboard(R)
ButtonBack = Keyboard(M)
ButtonStart = Keyboard(Esc)
ButtonLS = Keyboard(R)
ButtonRS = Keyboard(I)

[Workarounds]
PollReturnCode = 0
